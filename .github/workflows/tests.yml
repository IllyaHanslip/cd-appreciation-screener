# Continuous integration: runs the test suite on every push and pull request.
# The tests use temporary databases and fake Discogs responses, so no token or secrets
# are needed and no Discogs data is involved.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # a "Run workflow" button on the Actions tab

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]  # Linux for portability, Windows like the daily task
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.10"  # the oldest version the README promises
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
